spring.application.name=bodiala

# --- Provider selection + Hotelbeds APItude API --------------------------------
# Default supplier for requests that omit ?provider=. Currently only hotelbeds is implemented.
hotel.provider=${HOTEL_PROVIDER:hotelbeds}
# Hotelbeds creds — set via .env (copy .env.example) or env vars. Blank until you have a key/secret.
# apiKey + secret produce the per-request X-Signature; apiKey is also the Api-key header.
hotelbeds.base-url=${HOTELBEDS_BASE_URL:https://api.test.hotelbeds.com}
hotelbeds.api-key=${HOTELBEDS_API_KEY:}
hotelbeds.secret=${HOTELBEDS_SECRET:}
hotelbeds.language=${HOTELBEDS_LANGUAGE:ENG}
hotelbeds.source-market=${HOTELBEDS_SOURCE_MARKET:}
# Content catalog sync (POST /api/static-data/import when hotel.provider=hotelbeds). Bounded so a
# full ~250k-hotel sync doesn't blow the test key's daily quota — raise for a production sync.
hotelbeds.catalog-page-size=${HOTELBEDS_CATALOG_PAGE_SIZE:100}
hotelbeds.catalog-max-hotels=${HOTELBEDS_CATALOG_MAX_HOTELS:100}

# --- Local static-data cache (PostgreSQL, runs in Docker — see docker-compose.yml) --
# Start the DB first:  docker compose up -d   (dev.ps1 does this for you)
# For a real deployment set SPRING_DATASOURCE_URL/USERNAME/PASSWORD to the managed instance.
# The driver is auto-detected from the jdbc:postgresql: URL; the dialect from the connection.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bodiala}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bodiala}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bodiala}
# Flyway owns the schema (see the block below); Hibernate only checks its mappings against it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Batch inserts for the (potentially large) hotel master.
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true

# --- Schema migrations (Flyway) -------------------------------------------------
# Migrations live in src/main/resources/db/migration and run on startup. Name new ones with a
# timestamp version (V2026_11_08_1530__what_it_does.sql) and never edit one that is on develop.
#
# baseline-on-migrate is only for the switch from ddl-auto: a local dev database that ddl-auto=update
# built (tables, no flyway_schema_history) is marked as version 1 (the V1 baseline is that same
# schema) and then gets the later migrations. It must be OFF in staging and production (SEC-8 /
# KAN-69): there, an unexpected non-empty schema should stop startup, not be silently baselined.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Parallel branches use timestamp versions, so a slot database can already have a newer branch's
# migration applied when an older-timestamped one lands on develop. Strict ordering would then stop
# startup; out-of-order applies the older one late instead. The production profile (SEC-8 / KAN-69)
# should decide this setting again.
spring.flyway.out-of-order=true

# --- API docs -------------------------------------------------------------------
# Swagger UI:  http://localhost:8080/swagger-ui.html
# OpenAPI JSON: http://localhost:8080/v3/api-docs
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# --- JSON --------------------------------------------------------------------------
# Provider response DTOs (e.g. Hotelbeds) model only the fields we use — ignore the rest.
spring.jackson.deserialization.fail-on-unknown-properties=false

# --- Staff access (SEC-1, see security/RouteMatrix) --------------------------------
# Staff-only routes (catalog import, the admin booking list, /api/admin/**, actuator except health)
# take this one login over HTTP Basic. Set BODIALA_STAFF_PASSWORD in .env: at least 12 characters,
# or an encoded hash such as {bcrypt}$2a$10$... Blank = no staff user, so those routes always 401.
bodiala.security.staff.username=${BODIALA_STAFF_USERNAME:staff}
bodiala.security.staff.password=${BODIALA_STAFF_PASSWORD:}
