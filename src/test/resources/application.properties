# Tests run against the same PostgreSQL container (docker-compose.yml), so Docker must be up:
#   docker compose up -d
# They use an isolated 'bodiala_test' schema so they never touch the dev data in the default
# 'public' schema. Parallel agents override the schema name per slot (AGENTS.md §4); Flyway follows it.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bodiala}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bodiala}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:bodiala}
spring.jpa.properties.hibernate.default_schema=bodiala_test

# The schema comes from the real migrations, exactly as in the app, and Hibernate validates it.
# CleanTestSchemaBeforeMigrating (src/test/java) wipes the test schema before each Spring context
# migrates it, so every context starts empty (what create-drop used to give). Clean is enabled here
# only, and that class refuses any schema not named bodiala_test*.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.schemas=${spring.jpa.properties.hibernate.default_schema}
spring.flyway.clean-disabled=false

# No Hotelbeds credentials in tests — live API calls are expected to be refused, not attempted.
hotelbeds.api-key=
hotelbeds.secret=

# A test-only staff login, so the security tests can call the staff routes (SEC-1).
bodiala.security.staff.username=staff
bodiala.security.staff.password=test-staff-password
